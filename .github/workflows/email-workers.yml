name: Processar filas de e-mail

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-email-workers
  cancel-in-progress: false

jobs:
  process-email-queues:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      REDIS_QUEUE_KEY: ${{ vars.REDIS_QUEUE_KEY }}
      ACCESS_TOKEN_PREFIX: ${{ vars.ACCESS_TOKEN_PREFIX }}
      ACCESS_TOKEN_TTL_SECONDS: ${{ vars.ACCESS_TOKEN_TTL_SECONDS }}
      WORKSPACE_EMAIL_QUEUE_KEY: ${{ vars.WORKSPACE_EMAIL_QUEUE_KEY }}
      WORKSPACE_ACCESS_TOKEN_PREFIX: ${{ vars.WORKSPACE_ACCESS_TOKEN_PREFIX }}
    steps:
      - name: Validar configuração
        shell: bash
        run: |
          for name in REDIS_URL DATABASE_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASSWORD SMTP_FROM REDIS_QUEUE_KEY ACCESS_TOKEN_PREFIX ACCESS_TOKEN_TTL_SECONDS WORKSPACE_EMAIL_QUEUE_KEY WORKSPACE_ACCESS_TOKEN_PREFIX; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name nos Secrets ou Variables do repositório."
              exit 1
            fi
          done

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci --omit=dev

      - name: Processar as duas filas
        shell: bash
        run: |
          set +e
          npm start &
          employees_pid=$!
          npm run start:workspace &
          workspace_pid=$!

          wait "$employees_pid"
          employees_status=$?
          wait "$workspace_pid"
          workspace_status=$?

          if [ "$employees_status" -ne 0 ] || [ "$workspace_status" -ne 0 ]; then
            echo "::error::Falha em uma ou nas duas workers."
            exit 1
          fi
